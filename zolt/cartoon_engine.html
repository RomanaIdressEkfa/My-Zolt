<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@600;700&display=swap" rel="stylesheet">
<style>
html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:#000;
  font-family:'Hind Siliguri','Nirmala UI','Vrinda',sans-serif}
#cam{position:absolute;inset:0;transform-origin:50% 62%}
svg{position:absolute;left:0;top:0}
.logo{position:absolute;z-index:5;opacity:.62;display:flex;align-items:center;gap:14px;background:rgba(255,255,255,.18);padding:10px 30px 10px 12px;border-radius:40px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);color:#fff;font-size:40px;font-weight:700;text-shadow:0 1px 4px rgba(0,0,0,.45);font-family:Arial,'Nirmala UI',sans-serif}
.logo b{display:inline-flex;width:54px;height:54px;border-radius:50%;background:#1877f2;color:#fff;font:700 42px/58px Arial;justify-content:center;text-shadow:none}
#logo1{top:60px;left:44px}#logo2{bottom:60px;right:44px}
#top{display:none}
#top .series{display:inline-block;background:rgba(255,255,255,.14);color:#fff;font-size:34px;font-weight:600;padding:8px 26px;border-radius:30px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);text-shadow:0 1px 4px rgba(0,0,0,.6);letter-spacing:1px}
.series{display:inline-block;background:rgba(0,0,0,.55);color:#ffd84d;font-size:44px;font-weight:700;padding:8px 34px;border-radius:40px}
.ep{display:inline-block;margin-left:14px;background:#e53935;color:#fff;font-size:44px;font-weight:700;padding:8px 30px;border-radius:40px}
#sub{position:absolute;bottom:230px;left:60px;right:60px;text-align:center;z-index:5}
#sub #narr{display:inline-block;text-shadow:none;background:linear-gradient(#fff8e6,#f6e2b8);color:#3b2410;font-size:56px;font-weight:600;line-height:1.45;padding:22px 38px;border-radius:26px;border:5px solid #8a5a36;box-shadow:0 10px 30px rgba(0,0,0,.45)}
#bubble{position:absolute;z-index:5;max-width:660px;background:#fff;color:#1d1d1d;font-size:56px;font-weight:700;line-height:1.4;padding:22px 34px;border-radius:44px;border:6px solid #2a1a12;text-align:center;box-shadow:0 10px 26px rgba(0,0,0,.35)}
#bubble:after{content:'';position:absolute;bottom:-46px;left:var(--tail,50%);margin-left:-22px;border:22px solid transparent;border-top:36px solid #2a1a12}
#bubble:before{content:'';position:absolute;bottom:-33px;left:var(--tail,50%);margin-left:-16px;border:16px solid transparent;border-top:28px solid #fff;z-index:1}
.who{display:block;font-size:36px;color:#b5462e;margin-bottom:4px}
#sub span{background:rgba(0,0,0,.66);color:#fff;font-size:62px;font-weight:700;line-height:1.55;padding:8px 26px;
  border-radius:18px;box-decoration-break:clone;-webkit-box-decoration-break:clone;text-shadow:0 3px 8px rgba(0,0,0,.6)}
#title{position:absolute;left:40px;right:40px;top:300px;text-align:center;z-index:6}
#title b{display:block;color:#fff;font-size:130px;line-height:1.2;text-shadow:0 6px 0 #b71c1c,0 10px 24px #000}
#title i{display:inline-block;margin-top:24px;font-style:normal;background:#e53935;color:#fff;font-size:68px;font-weight:700;padding:8px 48px;border-radius:50px}
#fade{position:absolute;inset:0;background:#000;z-index:7;opacity:0}
</style></head>
<body>
<div id="cam"><svg id="bg" width="1080" height="1920" viewBox="0 0 1080 1920"></svg>
<svg id="fg" width="1080" height="1920" viewBox="0 0 1080 1920"></svg></div>
<div id="top"></div><div class="logo" id="logo1"></div><div class="logo" id="logo2"></div><div id="sub"></div><div id="bubble" style="display:none"></div><div id="title"></div><div id="fade"></div>
<script>
"use strict";
let OL = '#2a1a12';            // outline colour
const GROUND = 1440;              // feet line
const POS = {left: 270, center: 540, right: 815};
const CLOTH = {red:'#d63a3a', blue:'#2f6fd6', green:'#2e9e5b', yellow:'#e8b931', purple:'#7b4bc4', orange:'#ec7a2a',
  white:'#f4f1e8', brown:'#8a5a36', pink:'#e86fa6', teal:'#1f9c9c', black:'#3a3a3a', grey:'#8b8f96', maroon:'#8e2436'};
const SKIN = {man:'#b97a4f', woman:'#c98b5e', girl:'#d29a6c', boy:'#c4875a', old_man:'#a8704a', old_woman:'#b8805e'};
const HAIR = '#1d1410';
const R = Math.PI / 180;

function shade(hex, f) {   // f<1 darker, f>1 lighter
  const n = parseInt(hex.slice(1), 16);
  const c = [n >> 16, (n >> 8) & 255, n & 255].map(v => Math.max(0, Math.min(255, Math.round(f > 1 ? v + (255 - v) * (f - 1) : v * f))));
  return '#' + c.map(v => v.toString(16).padStart(2, '0')).join('');
}
function rnd(seed) { const x = Math.sin(seed * 9301 + 49297) * 233280; return x - Math.floor(x); }

// ------------------------------------------------------------------ limbs
// angles in degrees from straight down; positive = outward (away from body centre)
function arm(side, sx, sy, a1, a2, sleeve, skin, l1 = 105, l2 = 95) {
  const s = side;  // +1 right arm, -1 left arm
  const ex = sx + s * Math.sin(a1 * R) * l1, ey = sy + Math.cos(a1 * R) * l1;
  const hx = ex + s * Math.sin(a2 * R) * l2, hy = ey + Math.cos(a2 * R) * l2;
  const svg =
    `<line x1="${sx}" y1="${sy}" x2="${ex}" y2="${ey}" stroke="${OL}" stroke-width="40" stroke-linecap="round"/>` +
    `<line x1="${ex}" y1="${ey}" x2="${hx}" y2="${hy}" stroke="${OL}" stroke-width="32" stroke-linecap="round"/>` +
    `<line x1="${sx}" y1="${sy}" x2="${ex}" y2="${ey}" stroke="${sleeve}" stroke-width="33" stroke-linecap="round"/>` +
    `<line x1="${ex}" y1="${ey}" x2="${hx}" y2="${hy}" stroke="${skin}" stroke-width="25" stroke-linecap="round"/>` +
    `<circle cx="${hx}" cy="${hy}" r="17" fill="${skin}" stroke="${OL}" stroke-width="3.5"/>`;
  return {svg, hx, hy};
}
function leg(x, y1, y2, ang, skin, w = 26) {
  const x2 = x + Math.sin(ang * R) * (y2 - y1), y = y1 + Math.cos(ang * R) * (y2 - y1);
  return {svg: `<line x1="${x}" y1="${y1}" x2="${x2}" y2="${y}" stroke="${OL}" stroke-width="${w + 7}" stroke-linecap="round"/>` +
    `<line x1="${x}" y1="${y1}" x2="${x2}" y2="${y}" stroke="${skin}" stroke-width="${w}" stroke-linecap="round"/>` +
    `<ellipse cx="${x2 + 10}" cy="${y + 4}" rx="27" ry="11" fill="#5b3a26" stroke="${OL}" stroke-width="3"/>`, x: x2, y};
}

// ------------------------------------------------------------------ face
function face(p, st) {
  const {emotion, talking, t} = st;
  const type = p.type;
  const blink = ((t + p.seed * 1.7) % 3.6) < 0.14 ? 0.12 : 1;
  const crying = emotion === 'crying';
  let o = '';
  // eyes
  for (const s of [-1, 1]) {
    const x = s * 29;
    const ry = (emotion === 'surprised' ? 20 : 16) * blink;
    o += `<ellipse cx="${x}" cy="-4" rx="14" ry="${ry}" fill="#fff" stroke="${OL}" stroke-width="3"/>`;
    if (blink > .5) {
      const look = (emotion === 'sad' || crying) ? 5 : 0;
      o += `<circle cx="${x + 3}" cy="${-1 + look}" r="8.5" fill="#2b1b12"/><circle cx="${x + 6}" cy="${-5 + look}" r="3" fill="#fff"/>`;
    }
    if (type === 'woman' || type === 'girl' || type === 'old_woman')
      o += `<path d="M${x - 14},-10 l-7,-5 M${x + 14 * s},-12 l${7 * s},-6" stroke="${OL}" stroke-width="3"/>`;
    // brows
    let tilt = 0, by = -34;
    if (emotion === 'angry') tilt = 16;
    if (emotion === 'sad' || crying) tilt = -14;
    if (emotion === 'surprised') by = -46;
    const browCol = type.startsWith('old') ? '#e8e2d6' : HAIR;
    o += `<line x1="${x - 15}" y1="${by + (s < 0 ? -tilt : tilt) * .45}" x2="${x + 15}" y2="${by + (s < 0 ? tilt : -tilt) * .45}" stroke="${browCol}" stroke-width="7" stroke-linecap="round"/>`;
    if (crying) {
      for (let k = 0; k < 2; k++) {
        const dy = ((t * 95 + k * 45 + (s > 0 ? 20 : 0)) % 90);
        o += `<path d="M${x},${14 + dy} q-7,12 0,16 q7,-4 0,-16z" fill="#7fd0ff" stroke="#3a8fc2" stroke-width="2" opacity="${1 - dy / 95}"/>`;
      }
    }
  }
  // nose
  o += `<path d="M-2,8 q-9,16 2,20" fill="none" stroke="${OL}" stroke-width="3.5" stroke-linecap="round"/>`;
  // cheeks
  if (emotion === 'happy' || type === 'girl')
    o += `<ellipse cx="-44" cy="26" rx="13" ry="8" fill="#ff8a8a" opacity=".45"/><ellipse cx="44" cy="26" rx="13" ry="8" fill="#ff8a8a" opacity=".45"/>`;
  // mouth
  const lip = '#8c2f2f';
  if (talking) {
    const open = 4 + Math.abs(Math.sin(t * 13.5)) * 11 * (0.6 + 0.4 * Math.abs(Math.sin(t * 3.1)));
    o += `<ellipse cx="0" cy="46" rx="14" ry="${open}" fill="${lip}" stroke="${OL}" stroke-width="3.5"/>`;
  } else if (emotion === 'happy') {
    o += `<path d="M-22,38 q22,26 44,0 q-22,9 -44,0z" fill="${lip}" stroke="${OL}" stroke-width="3.5" stroke-linejoin="round"/>`;
  } else if (emotion === 'sad') {
    o += `<path d="M-16,52 q16,-14 32,0" fill="none" stroke="${OL}" stroke-width="4.5" stroke-linecap="round"/>`;
  } else if (crying) {
    const w = Math.sin(t * 9) * 2;
    o += `<path d="M-18,54 q18,${-20 + w} 36,0 q-18,8 -36,0z" fill="${lip}" stroke="${OL}" stroke-width="3.5"/>`;
  } else if (emotion === 'angry') {
    o += `<rect x="-18" y="40" width="36" height="12" rx="4" fill="#fff" stroke="${OL}" stroke-width="3.5"/><line x1="-18" y1="46" x2="18" y2="46" stroke="${OL}" stroke-width="2"/>`;
  } else if (emotion === 'surprised') {
    o += `<ellipse cx="0" cy="48" rx="10" ry="13" fill="${lip}" stroke="${OL}" stroke-width="3.5"/>`;
  } else {
    o += `<path d="M-14,44 q14,9 28,0" fill="none" stroke="${OL}" stroke-width="4.5" stroke-linecap="round"/>`;
  }
  if (emotion === 'angry') o += `<path d="M48,-58 l10,-10 m-4,16 l14,-4" stroke="#e53935" stroke-width="5" stroke-linecap="round"/>`;
  return o;
}

function hairBack(p) {
  if (p.type === 'woman') return `<path d="M-76,-560 C-96,-470 -86,-430 -62,-420 L62,-420 C86,-430 96,-470 76,-560 Z" fill="${HAIR}" stroke="${OL}" stroke-width="3.5"/>`;
  if (p.type === 'girl') return `<circle cx="-86" cy="-575" r="26" fill="${HAIR}" stroke="${OL}" stroke-width="3.5"/><circle cx="86" cy="-575" r="26" fill="${HAIR}" stroke="${OL}" stroke-width="3.5"/>` +
    `<path d="M-96,-560 q-14,50 -2,80 M96,-560 q14,50 2,80" stroke="${HAIR}" stroke-width="22" stroke-linecap="round" fill="none"/>`;
  if (p.type === 'old_woman') return `<path d="M-90,-600 C-110,-470 -100,-420 -70,-400 L70,-400 C100,-420 110,-470 90,-600 Z" fill="${p.cloth}" stroke="${OL}" stroke-width="3.5"/>`;
  return '';
}
function hairFront(p) {
  const c = p.cloth;
  switch (p.type) {
    case 'man': return `<path d="M-72,-575 C-80,-660 80,-668 73,-578 C62,-612 30,-628 -5,-614 C-30,-628 -58,-612 -72,-575Z" fill="${HAIR}" stroke="${OL}" stroke-width="3.5"/>` +
      `<path d="M-64,-560 q-4,-26 4,-36 M64,-560 q4,-26 -4,-36" stroke="${HAIR}" stroke-width="10" fill="none"/>` +
      (p.mustache ? `<path d="M-22,-529 q22,-10 44,0 q-22,6 -44,0z" fill="${HAIR}"/>` : '');
    case 'boy': return `<path d="M-72,-575 l-4,-30 l20,8 l6,-30 l22,20 l14,-30 l18,26 l18,-22 l10,28 l24,-6 l-6,36 C50,-620 -50,-620 -72,-575Z" fill="${HAIR}" stroke="${OL}" stroke-width="3.5"/>`;
    case 'woman': return `<path d="M-74,-570 C-80,-668 80,-668 74,-570 C56,-625 18,-642 0,-628 C-18,-642 -56,-625 -74,-570Z" fill="${HAIR}" stroke="${OL}" stroke-width="3.5"/>` +
      `<circle cx="0" cy="-591" r="5" fill="#d62828"/>` +   // small bindi / sindoor dot
      `<circle cx="0" cy="-668" r="28" fill="${HAIR}" stroke="${OL}" stroke-width="3.5"/>`;
    case 'girl': return `<path d="M-74,-570 C-82,-668 82,-668 74,-570 C50,-610 20,-622 0,-606 C-20,-622 -50,-610 -74,-570Z" fill="${HAIR}" stroke="${OL}" stroke-width="3.5"/>` +
      `<path d="M-92,-600 l-22,-14 l4,28z M92,-600 l22,-14 l-4,28z" fill="${c}" stroke="${OL}" stroke-width="3"/>`;
    case 'old_man': return `<path d="M-74,-560 C-84,-610 -64,-626 -52,-622 C-60,-596 -64,-578 -70,-556Z M74,-560 C84,-610 64,-626 52,-622 C60,-596 64,-578 70,-556Z" fill="#ece7dc" stroke="${OL}" stroke-width="3"/>` +
      `<path d="M-60,-618 q60,-46 120,0 l0,-6 q-60,-30 -120,0z" fill="#fff" stroke="${OL}" stroke-width="3"/>` +   // tupi cap
      `<path d="M-50,-540 C-60,-470 -20,-440 0,-438 C20,-440 60,-470 50,-540 C30,-512 -30,-512 -50,-540Z" fill="#f2eee6" stroke="${OL}" stroke-width="3"/>` +
      `<path d="M-26,-532 q26,-12 52,0 q-26,8 -52,0z" fill="#f2eee6" stroke="${OL}" stroke-width="2.5"/>`;
    case 'old_woman': return `<path d="M-60,-616 C-40,-636 40,-636 60,-616 C40,-622 -40,-622 -60,-616Z" fill="#ddd6ca"/>` +
      `<path d="M-92,-560 C-100,-690 100,-690 92,-560 C80,-640 -80,-640 -92,-560Z" fill="${c}" stroke="${OL}" stroke-width="3.5"/>` +
      `<path d="M-92,-560 C-98,-650 98,-650 92,-560" fill="none" stroke="${shade(c, .6)}" stroke-width="9"/>` +
      `<circle cx="-29" cy="-579" r="21" fill="none" stroke="#6b5040" stroke-width="4"/><circle cx="29" cy="-579" r="21" fill="none" stroke="#6b5040" stroke-width="4"/><line x1="-8" y1="-580" x2="8" y2="-580" stroke="#6b5040" stroke-width="4"/>`;
  }
  return '';
}

// ------------------------------------------------------------------ whole person (drawn facing right, feet at 0,0)
function person(p, st) {
  const {pose, t} = st;
  const type = p.type, skin = SKIN[type] || SKIN.man;
  const cloth = p.cloth, cloth2 = p.cloth2;
  const sitting = pose === 'sit' || pose === 'sew';
  const walking = pose === 'walk';
  const ph = t * 7.5;
  const swing = walking ? Math.sin(ph) * 24 : 0;
  const bob = walking ? -Math.abs(Math.cos(ph)) * 10 : 0;
  const breath = Math.sin(t * 2.2 + p.seed) * 2.5;
  const sob = pose === 'cry' ? Math.sin(t * 13) * 3 : 0;
  const lift = sitting ? 175 : 0;             // upper body drop when sitting
  const sh = -462 + lift + bob + breath * .4 + sob;
  let o = '';

  // ---- legs / lower body
  if (sitting) {
    const lap = (type === 'man' || type === 'old_man') ? cloth2 : cloth;
    o += `<path d="M-95,-150 C-110,-60 -100,-8 -60,-6 L120,-6 C150,-8 150,-70 110,-110 L60,-150Z" fill="${lap}" stroke="${OL}" stroke-width="4"/>`;
    o += `<ellipse cx="128" cy="-4" rx="26" ry="11" fill="${skin}" stroke="${OL}" stroke-width="3"/>`;
    if (type === 'woman' || type === 'old_woman') o += `<path d="M-100,-20 L140,-20" stroke="${cloth2}" stroke-width="12"/>`;
  } else if (type === 'man' || type === 'old_man') {
    const hem = type === 'old_man' ? -60 : -58;
    const l1 = leg(-22, hem - 10, 0, swing, skin), l2 = leg(22, hem - 10, 0, -swing, skin);
    o += l1.svg + l2.svg;
    const sway = swing * .9;
    o += `<path d="M-58,-318 L58,-318 L${66 + sway},${hem} L${-66 + sway},${hem} Z" fill="${cloth2}" stroke="${OL}" stroke-width="4"/>`;
    for (let k = -2; k <= 2; k++) o += `<line x1="${k * 24}" y1="-316" x2="${k * 27 + sway}" y2="${hem}" stroke="${shade(cloth2, .72)}" stroke-width="5" opacity=".7"/>`;
    for (let k = 1; k < 5; k++) o += `<line x1="${-58 - k * 1.6 + sway * k / 5}" y1="${-318 + k * 52}" x2="${58 + k * 1.6 + sway * k / 5}" y2="${-318 + k * 52}" stroke="${shade(cloth2, .72)}" stroke-width="5" opacity=".7"/>`;
    o += `<line x1="-58" y1="-312" x2="58" y2="-312" stroke="${shade(cloth2, .6)}" stroke-width="8"/>`;
  } else if (type === 'woman' || type === 'old_woman') {
    const l1 = leg(-18, -40, 0, swing * .5, skin, 22), l2 = leg(18, -40, 0, -swing * .5, skin, 22);
    o += l1.svg + l2.svg;
    const sway = swing * .7;
    o += `<path d="M-54,-318 L54,-318 C70,-200 ${84 + sway},-90 ${86 + sway},-14 L${-86 + sway},-14 C-84,-90 -70,-200 -54,-318Z" fill="${cloth}" stroke="${OL}" stroke-width="4"/>`;
    o += `<path d="M${-86 + sway},-34 L${86 + sway},-34" stroke="${cloth2}" stroke-width="16"/><path d="M${-86 + sway},-14 L${86 + sway},-14" stroke="${OL}" stroke-width="4"/>`;
    for (let k = 0; k < 4; k++) o += `<line x1="${4 + k * 9}" y1="-300" x2="${8 + k * 14 + sway}" y2="-40" stroke="${shade(cloth, .78)}" stroke-width="4"/>`;
  } else if (type === 'girl') {
    const l1 = leg(-22, -175, 0, swing, skin, 24), l2 = leg(22, -175, 0, -swing, skin, 24);
    o += l1.svg + l2.svg;
    o += `<path d="M-52,-330 L52,-330 L${100},-170 Q0,-150 -100,-170Z" fill="${cloth}" stroke="${OL}" stroke-width="4"/>`;
    o += `<path d="M-100,-170 Q0,-150 100,-170" fill="none" stroke="#fff" stroke-width="9" stroke-dasharray="14 8"/>`;
  } else if (type === 'boy') {
    const l1 = leg(-24, -210, 0, swing, skin, 25), l2 = leg(24, -210, 0, -swing, skin, 25);
    o += l1.svg + l2.svg;
    o += `<path d="M-56,-322 L56,-322 L62,-200 L6,-200 L0,-240 L-6,-200 L-62,-200Z" fill="${cloth2}" stroke="${OL}" stroke-width="4"/>`;
  }

  // ---- hair behind body
  o += `<g transform="translate(0 ${lift + bob + sob})">${hairBack(p)}</g>`;

  // ---- arms behind? (none) ; torso
  const tw = (type === 'woman' || type === 'girl' || type === 'old_woman') ? 52 : 60;
  const top = sh - 8, waist = sitting ? -150 : -312;
  const torsoCol = (type === 'old_man') ? '#f4f1e8' : cloth;
  if (type === 'old_man') {   // long panjabi down to the knees
    o += `<path d="M${-tw},${top} L${tw},${top} L${tw + 8},${sitting ? -120 : -165} L${-tw - 8},${sitting ? -120 : -165}Z" fill="#f4f1e8" stroke="${OL}" stroke-width="4"/>`;
    o += `<line x1="0" y1="${top + 10}" x2="0" y2="${top + 110}" stroke="#c9c2b4" stroke-width="4"/>`;
    for (let k = 0; k < 3; k++) o += `<circle cx="0" cy="${top + 30 + k * 30}" r="4" fill="#c9c2b4"/>`;
  } else {
    o += `<path d="M${-tw},${top} Q0,${top - 10} ${tw},${top} L${tw - 6},${waist} L${-tw + 6},${waist}Z" fill="${torsoCol}" stroke="${OL}" stroke-width="4"/>`;
    if (type === 'man' || type === 'boy') {
      o += `<path d="M-20,${top - 2} L0,${top + 26} L20,${top - 2}" fill="${shade(cloth, 1.35)}" stroke="${OL}" stroke-width="3"/>`;
      o += `<line x1="0" y1="${top + 26}" x2="0" y2="${waist}" stroke="${shade(cloth, .7)}" stroke-width="3"/>`;
      o += `<rect x="18" y="${top + 40}" width="26" height="22" rx="3" fill="none" stroke="${shade(cloth, .7)}" stroke-width="3"/>`;
    }
    if (type === 'woman' || type === 'old_woman') {   // sari pallu across the chest
      o += `<path d="M${tw - 4},${top} L${tw + 6},${top + 20} L${-tw + 6},${waist + 2} L${-tw + 2},${waist - 40}Z" fill="${shade(cloth, .88)}" stroke="${OL}" stroke-width="3.5"/>`;
      o += `<path d="M${tw + 2},${top + 14} L${-tw + 4},${waist - 6}" stroke="${cloth2}" stroke-width="10"/>`;
    }
    if (type === 'girl') o += `<path d="M-30,${top} q30,26 60,0" fill="none" stroke="#fff" stroke-width="6"/>`;
  }

  // ---- arms (angles: [upper, fore] for left (-1) and right (+1) arm)
  let L = [12, 4], Rt = [12, 4];
  const talkGesture = st.talking ? (Math.sin(t * 4.3) + 1) * 26 : 0;
  switch (pose) {
    case 'walk': L = [8 - swing * .9, 2 - swing * .5]; Rt = [8 + swing * .9, 2 + swing * .5]; break;
    case 'angry': L = [38, -62]; Rt = [74, 86 + Math.sin(t * 6) * 6]; break;
    case 'cry': L = [-8, -82]; Rt = [-8, -82]; break;
    case 'happy': L = [140 + Math.sin(t * 5) * 6, 160]; Rt = [140 - Math.sin(t * 5) * 6, 160]; break;
    case 'give': Rt = [66, 82]; break;
    case 'sit': L = [6, -72]; Rt = [6, -72]; break;
    case 'sew': L = [8, -70]; Rt = [10, -74 + Math.sin(t * 5) * 28]; break;
    case 'think': Rt = [12, -158]; break;
    case 'pray': L = [-6, -148]; Rt = [-6, -148]; break;
    default: Rt = [12, 4 + talkGesture];
  }
  const sleeve = type === 'old_man' ? '#f4f1e8' : (type === 'woman' || type === 'old_woman' ? shade(cloth, .88) : cloth);
  const la = arm(-1, -tw + 4, sh + 6, L[0], L[1], sleeve, skin);
  const ra = arm(1, tw - 4, sh + 6, Rt[0], Rt[1], sleeve, skin);
  o += la.svg + ra.svg;
  if (type === 'woman' || type === 'old_woman' || type === 'girl')
    o += `<circle cx="${la.hx}" cy="${la.hy - 18}" r="9" fill="none" stroke="#e8b931" stroke-width="4"/><circle cx="${ra.hx}" cy="${ra.hy - 18}" r="9" fill="none" stroke="#e8b931" stroke-width="4"/>`;

    `<g transform="translate(0 -570)">${face(p, st)}</g>` + hairFront(p) + `</g>`;
  return {svg: o, hand: {x: ra.hx, y: ra.hy}, lap: {x: 20, y: -130}};
}

function sky(time, h) {
  const g = {day: ['#7cc6f2', '#d8f0ff'], evening: ['#f28c4a', '#ffd59a'], night: ['#0d1b3d', '#2c3e70']}[time] || ['#7cc6f2', '#d8f0ff'];
  let o = `<defs><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${g[0]}"/><stop offset="1" stop-color="${g[1]}"/></linearGradient></defs><rect width="1080" height="${h}" fill="url(#sky)"/>`;
  if (time === 'night') {
    for (let i = 0; i < 40; i++) o += `<circle cx="${rnd(i) * 1080}" cy="${rnd(i + 99) * h * .8}" r="${1.5 + rnd(i + 7) * 2.5}" fill="#fff" opacity=".8"/>`;
    o += `<circle cx="820" cy="${h * .22}" r="60" fill="#fdf6d8"/><circle cx="845" cy="${h * .2}" r="56" fill="${g[0]}"/>`;
  } else if (time === 'evening') {
    o += `<circle cx="760" cy="${h * .78}" r="110" fill="#ffb347" opacity=".95"/>`;
  } else {
    o += `<circle cx="860" cy="${h * .18}" r="70" fill="#fff3b0"/>`;
    for (const [x, y] of [[180, .2], [560, .12]]) o += `<g fill="#fff" opacity=".9"><ellipse cx="${x}" cy="${h * y}" rx="90" ry="34"/><ellipse cx="${x + 60}" cy="${h * y - 22}" rx="60" ry="34"/><ellipse cx="${x - 60}" cy="${h * y - 6}" rx="50" ry="26"/></g>`;
  }
  return o;
}

    `<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="none" stroke="#6b4423" stroke-width="22"/>` +
    [1, 2, 3].map(k => `<line x1="${x + k * w / 4}" y1="${y}" x2="${x + k * w / 4}" y2="${y + h}" stroke="#555" stroke-width="7"/>`).join('') +

// ------------------------------------------------------------------ scene rendering
let DATA = null, cur = -1;
function sky_life(t) {
  let o = '';
  for (let k = 0; k < 4; k++) {   // soft clouds drifting right
    const x = ((rnd(k + 40) * 1300 + t * (10 + k * 4)) % 1400) - 180, y = 260 + rnd(k + 60) * 420;
    o += `<g fill="#fffaf0" opacity=".95"><ellipse cx="${x}" cy="${y}" rx="85" ry="30"/><ellipse cx="${x + 45}" cy="${y - 20}" rx="55" ry="32"/><ellipse cx="${x - 50}" cy="${y - 6}" rx="45" ry="22"/></g>`;
  }
  for (let k = 0; k < 3; k++) {   // birds crossing with flapping wings
    const x = ((rnd(k + 80) * 1200 + t * (45 + k * 12)) % 1300) - 100, y = 330 + rnd(k + 90) * 300 + Math.sin(t * 2 + k) * 12;
    const f = Math.sin(t * 10 + k * 2) * 9;
    o += `<path d="M${x - 16},${y - f} Q${x - 7},${y - 6} ${x},${y} Q${x + 7},${y - 6} ${x + 16},${y - f}" stroke="#4a4a4a" stroke-width="3.5" fill="none" stroke-linecap="round"/>`;
  }
  return o;
}

function setup(data) {
  DATA = data;
  const handle = data.handle || data.series;
  for (const id of ['logo1', 'logo2']) {
    const el = document.getElementById(id);
    el.innerHTML = handle ? `<b>f</b>@${esc(handle)}` : '';
    el.style.display = handle ? 'flex' : 'none';
  }
  if (data.style === 'flat') OL = '#6b5444';   // soft brown lines instead of black
}
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c])); }

function render(t, cover = false) {
  const scenes = DATA.scenes;
  let i = scenes.findIndex(s => t < s.end);
  if (i < 0) i = scenes.length - 1;
  const sc = scenes[i], lt = t - sc.start, len = sc.end - sc.start;
  if (i !== cur) {
    document.getElementById('bg').innerHTML = (BG[sc.background] || BG.home)(sc.time) +
      (sc.time === 'night' ? `<rect width="1080" height="1920" fill="#0a1433" opacity=".42"/>` : sc.time === 'evening' ? `<rect width="1080" height="1920" fill="#ff8a3d" opacity=".12"/>` : '');
    cur = i;
  }
  let o = '';
  if (['village', 'village_row', 'street'].includes(sc.background) && sc.time !== 'night') o += sky_life(lt + sc.start);
  const cast = DATA.cast;
  const props = sc.props || [];
  const anyWalk = (sc.characters || []).some(c => c.pose === 'walk');
  if (props.includes('rickshaw')) o += rickshaw(sc.background === 'street' || sc.background === 'village' ? 250 : 200, lt, anyWalk);
  if (props.includes('lantern')) o += `<g transform="translate(${sc.characters.length > 1 ? 540 : 860} ${GROUND + 90}) scale(1.3)">${PROPS.lantern('', lt)}</g>`;
  if (props.includes('rice_plate')) o += `<g transform="translate(540 ${GROUND + 40})">${PROPS.rice_plate()}</g>`;
  const held = props.filter(p => HOLDABLE.has(p));
  let heldUsed = false, onTop = '';
  const chars = (sc.characters || []).map(c => ({...c, p: cast[c.id]})).filter(c => c.p);
  const ln = cover ? null : (sc.lines || []).find(l => t >= l.start && t < l.end);
  const chunk = ln ? ln.chunks.find(c => t >= c[0] && t < c[1]) : null;
  const placed = {};
  const holder = (chars.find(c => c.pose === 'give') || chars.find(c => c.pose !== 'sew') || {}).id;
  chars.forEach((c, k) => {
    const st = {pose: c.pose || 'stand', emotion: c.pose === 'cry' ? 'crying' : (c.emotion || 'neutral'), talking: !!(ln && chunk && ln.speaker === c.id), t: lt};
    const fig = person(c.p, st);
    const wide = sc.shot === 'wide';
    const gy = wide ? 1600 : GROUND;
    let x = wide ? ({left: 190, center: 540, right: 890}[c.position] ?? 540) : (POS[c.position] ?? POS.center);
    const dir = c.facing === 'left' ? -1 : 1;
    if (st.pose === 'walk') x += dir * (lt / len - .5) * 260;
    const scale = (c.p.type === 'girl' || c.p.type === 'boy' ? .92 : (c.p.type.startsWith('old') ? 1.24 : 1.3)) * (wide ? .58 : 1);
    let extra = '';
    if (st.pose === 'sew' && props.includes('sewing')) extra += `<g transform="translate(20 -120)">${PROPS.sewing()}</g>`;
    if (!heldUsed && held.length && c.id === holder) {   // drawn after everyone so nobody covers it
      const hx = x + dir * scale * (fig.hand.x + 10), hy = gy + scale * (fig.hand.y + 6);
      onTop += `<g transform="translate(${hx} ${hy}) scale(${scale})">${PROPS[held[0]]('', lt)}</g>`;
      heldUsed = true;
    }
    placed[c.id] = {x, top: gy - scale * (st.pose === 'sit' || st.pose === 'sew' ? 560 : 740)};
    o += `<g transform="translate(${x} ${gy}) scale(${dir * scale} ${scale})">` +
      `<ellipse cx="0" cy="4" rx="95" ry="16" fill="#000" opacity=".18"/>` + fig.svg + extra + `</g>`;
  });
  o += onTop;
  if ((sc.props || []).includes('jinn')) {
    const near = sc.shot !== 'wide';
    o += jinn(near ? 720 : 760, near ? GROUND + 40 : 1250, lt, near ? 1.05 : .5) + jinn(near ? 960 : 900, near ? GROUND + 20 : 1240, lt + 1.7, near ? 1.0 : .48);
    o += fragrance(lt + sc.start);
  }
  if ((sc.props || []).includes('ghost')) {
    const near = sc.shot !== 'wide';
    o = o.replace('<!--ghost-->', '');
    o += ghost(near ? 880 : 900, near ? GROUND + 40 : 1250, lt, near ? .9 : .45);
  }
  if (sc.weather === 'fog' || (sc.time === 'night' && ['bamboo', 'village'].includes(sc.background))) o += fog(lt + sc.start);
  if (sc.weather === 'rain') for (let k = 0; k < 90; k++) {
    const x = (rnd(k) * 1200 + lt * 180) % 1150 - 40, y = (rnd(k + 300) * 1920 + lt * 1500) % 1920;
    o += `<line x1="${x}" y1="${y}" x2="${x - 12}" y2="${y + 44}" stroke="#bfe3ff" stroke-width="3" opacity=".6"/>`;
  }
  if (sc.time === 'night') o += `<rect width="1080" height="1920" fill="#0a1433" opacity=".18"/>` +
    `<defs><radialGradient id="vig" cx="50%" cy="55%" r="70%"><stop offset=".55" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".7"/></radialGradient></defs><rect width="1080" height="1920" fill="url(#vig)"/>`;
  document.getElementById('fg').innerHTML = o;

  // camera
  const k = Math.min(1, lt / len);
  const cam = {zoom_in: [1 + .1 * k, 0], zoom_out: [1.1 - .1 * k, 0], pan_left: [1.08, 40 - 80 * k], pan_right: [1.08, -40 + 80 * k], still: [1.03, 0]}[sc.camera] || [1 + .06 * k, 0];
  document.getElementById('cam').style.transform = `translateX(${cam[1]}px) scale(${cam[0]})`;

  // subtitles, title, fades
  const subEl = document.getElementById('sub'), bub = document.getElementById('bubble');
  subEl.innerHTML = ''; bub.style.display = 'none';
  if (chunk) {
    const who = placed[ln.speaker];
    if (!who) {
      subEl.innerHTML = `<span id="narr">${esc(chunk[2])}</span>`;
    } else {   // speech bubble above the speaker, following the camera
      const name = (DATA.cast[ln.speaker] || {}).name;
      bub.innerHTML = (name ? `<span class="who">${esc(name)}</span>` : '') + esc(chunk[2]);
      bub.style.display = 'block';
      const sx = 540 + (who.x - 540) * cam[0] + cam[1], sy = 1190 + (who.top - 1190) * cam[0];
      const w = bub.offsetWidth, h = bub.offsetHeight;
      const left = Math.max(30, Math.min(1050 - w, sx - w / 2));
      bub.style.left = left + 'px';
      bub.style.top = Math.max(150, sy - h - 40) + 'px';
      bub.style.setProperty('--tail', Math.max(50, Math.min(w - 50, sx - left)) + 'px');
    }
  }
  const titleEl = document.getElementById('title');
  const showTitle = cover || t < 3.2;
  titleEl.innerHTML = showTitle ? `<b>${esc(DATA.title)}</b>` + (DATA.episode ? `<i>${esc(DATA.episode)}</i>` : '') : '';
  titleEl.style.opacity = cover ? 1 : Math.max(0, Math.min(1, (3.2 - t) / .5));
  const fade = cover ? 0 : Math.max(lt < .3 ? 1 - lt / .3 : 0, (sc.end - t) < .2 && i < scenes.length - 1 ? 1 - (sc.end - t) / .2 : 0, (DATA.total - t) < .6 ? 1 - (DATA.total - t) / .6 : 0);
  document.getElementById('fade').style.opacity = fade;
}
</script>
</body></html>
